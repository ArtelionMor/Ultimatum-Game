<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <title>Market Ultimatum v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="goal">
      <span class="lvl-badge" id="lvl-badge">⭐ 1</span>
      <button id="tasks-btn" class="tasks-btn">
        <span class="tasks-label"><span>📋 <b id="tasks-text">Tâches 0/3</b></span><span id="tasks-reward"></span></span>
        <span class="goal-bar"><span class="goal-fill" id="goal-fill"></span></span>
      </button>
      <button id="debug-toggle" title="Debug" aria-label="Debug">🐞</button>
    </div>
    <div class="hud-row">
      <div id="money-box"><span class="coin ico-mask" style="--icon:url(assets/kenney/icons/dollar.png)"></span><span id="money">0 $</span></div>
      <div id="income">+0 $/min</div>
    </div>
  </header>

  <main>
    <section id="screen-factory" class="screen active">
      <canvas id="floor"></canvas>
      <div id="stock-row"><div id="stock-chips"></div><button class="btn small hidden" id="stock-btn"></button><button class="btn small" id="expand-btn"></button></div>
    </section>

    <section id="screen-market" class="screen">
      <div id="market-tabs"></div>
      <div id="mono-banner" class="mono"></div>
      <div class="card" id="price-card">
        <div class="row">
          <span class="label">🏷️ Ton prix</span>
          <span id="price-value" class="big">8 $</span>
        </div>
        <div class="price-ctrl">
          <button class="btn round" id="price-minus" aria-label="Baisser le prix">−</button>
          <input type="range" id="price-slider" min="1" max="40" step="0.5">
          <button class="btn round" id="price-plus" aria-label="Monter le prix">+</button>
        </div>
        <div class="kv">
          <span>Marge <b id="margin">+5 $</b></span>
          <span>Qualité <b id="quality">★1</b></span>
        </div>
      </div>
      <div id="cards" class="cards"></div>
      <div id="card-dots" class="dots hidden"></div>
    </section>

    <section id="screen-auction" class="screen">
      <div id="auc-tabs" class="subtabs">
        <button data-sub="lots" class="active">🔨 Enchères</button>
        <button data-sub="offers">✉️ Offres<span class="dot hidden" id="auc-offers-dot"></span></button>
      </div>
      <div id="auc-body"></div>
    </section>
  </main>

  <!-- Thumb zone: everything the player taps often sits right above the tabs. -->
  <div id="dock">
    <div id="hint">👉 …</div>
    <div id="tooldock">
      <div id="tool-menu" class="hidden"></div>
      <div id="toolbar"></div>
    </div>
  </div>

  <div id="side-btns">
      <button id="recipes-btn" class="hud-icon side" title="Recettes" aria-label="Recettes">📜<span class="dot red hidden" id="recipes-dot"></span></button>
      <button id="stats-btn" class="hud-icon side" title="Statistiques" aria-label="Statistiques"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#5aa9ff"/><path d="M10 10 L10 2 A8 8 0 0 1 17.6 12.5 Z" fill="#ffcf4a"/><path d="M10 10 L17.6 12.5 A8 8 0 0 1 6 17 Z" fill="#3ddc84"/></svg></button>
  </div>
  <div id="edit-widget" class="hidden"></div>
  <div id="confirm" class="overlay hidden">
    <div class="confirm-box">
      <p id="confirm-text"></p>
      <div class="confirm-btns"><button class="btn" id="confirm-no">Annuler</button><button class="btn danger" id="confirm-yes">Vendre</button></div>
    </div>
  </div>

  <div id="offer-notif" class="hidden"></div>

  <div id="recipes-drawer" class="drawer hidden">
    <div class="drawer-panel">
      <div class="tasks-head"><b>📜 Recettes</b><button class="btn small" id="recipes-close">✕</button></div>
      <div id="recipes-body"></div>
      <div class="drawer-foot"><button class="btn" id="recipes-close-bottom">Fermer</button></div>
    </div>
  </div>

  <div id="stats" class="overlay hidden">
    <div class="tasks-box">
      <div class="tasks-head"><b><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="#5aa9ff"/><path d="M10 10 L10 2 A8 8 0 0 1 17.6 12.5 Z" fill="#ffcf4a"/><path d="M10 10 L17.6 12.5 A8 8 0 0 1 6 17 Z" fill="#3ddc84"/></svg> Statistiques</b><button class="btn small" id="stats-close">✕</button></div>
      <div id="stats-body"></div>
    </div>
  </div>

  <div id="help" class="overlay hidden">
    <div class="tasks-box help-box">
      <div class="tasks-head"><b id="help-title"></b><button class="btn small" id="help-close">✕</button></div>
      <div id="help-body"></div>
    </div>
  </div>

  <div id="tasks" class="overlay hidden">
    <div class="tasks-box">
      <div class="tasks-head"><b id="tasks-title">Niveau 1</b><button class="btn small" id="tasks-close">✕</button></div>
      <div id="tasks-list"></div>
      <div id="tasks-foot"></div>
    </div>
  </div>

  <nav id="tabs">
    <button class="tab active" data-tab="factory">🏭 Usine</button>
    <button class="tab locked" data-tab="market"><span class="tab-label">🔒 Marché</span><span class="dot hidden"></span></button>
    <button class="tab hidden" data-tab="auction"><span class="tab-label">🔨 Enchères</span><span class="dot hidden"></span></button>
  </nav>

  <div id="fx"></div>
  <div id="toasts"></div>

  <div id="debug" class="hidden">
    <div class="row"><b>Debug</b><button class="btn small" id="debug-close">✕</button></div>
    <div class="row">Vitesse
      <span class="seg-btns" id="speed-btns">
        <button class="btn small" data-speed="1">×1</button>
        <button class="btn small" data-speed="10">×10</button>
        <button class="btn small" data-speed="50">×50</button>
      </span>
    </div>
    <div class="row">Température <input type="number" id="dbg-temp" step="0.05" min="0.05"></div>
    <div id="dbg-segments"></div>
    <div class="row">
      <button class="btn small" id="dbg-money">+1K $</button>
      <button class="btn small danger" id="dbg-reset">Reset</button>
    </div>
    <div class="row">
      <button class="btn small" id="dbg-export">⬇ Exporter la partie</button>
      <button class="btn small" id="dbg-import">⬆ Importer</button>
      <input type="file" id="dbg-import-file" accept=".json,application/json" hidden>
    </div>
  </div>

</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
